<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mode Switch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fafafd;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  overflow:hidden;
}

.scene{
  position:relative;
  width:100%;
  max-width:1000px;
  height:440px;
}

/* ── Background haze ── */
.haze{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:580px;height:580px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(178,158,255,0.2) 0%,
    rgba(148,175,255,0.13) 28%,
    rgba(195,185,255,0.06) 52%,
    transparent 72%
  );
  filter:blur(50px);
  pointer-events:none;
}

/* ── AUTO pill ── */
.pill-top{
  position:absolute;
  left:50%;transform:translateX(-50%);
  top:calc(50% - 152px);
  padding:5px 16px;
  background:#fff;
  border-radius:16px;
  font-size:11px;font-weight:600;
  letter-spacing:1.5px;
  color:#aaa;
  box-shadow:0 1px 8px rgba(0,0,0,0.05);
  border:1px solid rgba(0,0,0,0.03);
  z-index:20;
  user-select:none;
}

/* ── Glass card ── */
.glass-card{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:195px;height:195px;
  border-radius:46px;
  background:linear-gradient(145deg,
    rgba(255,255,255,0.6) 0%,
    rgba(238,232,255,0.35) 50%,
    rgba(228,222,252,0.2) 100%
  );
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1.5px solid rgba(255,255,255,0.8);
  box-shadow:
    0 12px 48px rgba(120,100,200,0.12),
    0 2px 8px rgba(0,0,0,0.03),
    inset 0 1px 0 rgba(255,255,255,0.6);
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ── Pulse glow ── */
.pulse{
  position:absolute;
  inset:-30px;
  border-radius:70px;
  background:radial-gradient(circle,rgba(130,110,240,0.28) 0%,transparent 65%);
  opacity:0;
  pointer-events:none;
  z-index:1;
}
.pulse.fire{animation:pulseAnim 600ms ease-out forwards}
@keyframes pulseAnim{
  0%{opacity:0;transform:scale(0.8)}
  25%{opacity:1;transform:scale(1.05)}
  100%{opacity:0;transform:scale(1.3)}
}

/* ── Center icon ── */
.center-icon{
  position:relative;z-index:2;
  width:90px;height:90px;
  display:flex;align-items:center;justify-content:center;
}
.center-icon svg{
  width:90px;height:90px;
  position:absolute;
}
.center-icon svg.enter{animation:cIn .5s cubic-bezier(.4,0,.2,1) forwards}
.center-icon svg.exit{animation:cOut .4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes cIn{from{opacity:0;transform:scale(.7) translateX(24px)}to{opacity:1;transform:scale(1) translateX(0)}}
@keyframes cOut{from{opacity:1;transform:scale(1) translateX(0)}to{opacity:0;transform:scale(.7) translateX(-24px)}}

/* ── Label pill ── */
.pill-label{
  position:absolute;
  left:50%;transform:translateX(-50%);
  top:calc(50% + 132px);
  padding:8px 26px;
  background:#fff;
  border-radius:18px;
  font-size:17px;font-weight:500;
  color:#666;
  box-shadow:0 2px 12px rgba(0,0,0,0.05);
  border:1px solid rgba(0,0,0,0.03);
  z-index:20;
  transition:opacity .25s;
  white-space:nowrap;
  user-select:none;
}

/* ── Floating buttons ── */
.float-btn{
  position:absolute;
  border-radius:50%;
  border:none;outline:none;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:15;
  transition:
    width .5s cubic-bezier(.4,0,.2,1),
    height .5s cubic-bezier(.4,0,.2,1),
    top .5s cubic-bezier(.4,0,.2,1),
    left .5s cubic-bezier(.4,0,.2,1),
    right .5s cubic-bezier(.4,0,.2,1),
    box-shadow .5s ease,
    opacity .5s ease;
}
.float-btn:hover{filter:brightness(1.08)}
.float-btn svg{fill:white;pointer-events:none}

/* ── Slot positions ── */
/* 0: far left  */
.slot-0{top:calc(50% + 8px);left:5%;width:82px;height:82px;box-shadow:0 6px 26px rgba(0,0,0,0.1)}
.slot-0 svg{width:38px;height:38px}

/* 1: left-center  */
.slot-1{top:calc(50% - 24px);left:23%;width:55px;height:55px;box-shadow:0 4px 16px rgba(0,0,0,0.08);opacity:.8}
.slot-1 svg{width:25px;height:25px}

/* 2: right-center */
.slot-2{top:calc(50% - 18px);right:21%;width:70px;height:70px;box-shadow:0 5px 22px rgba(0,0,0,0.09)}
.slot-2 svg{width:32px;height:32px}

/* 3: far right */
.slot-3{top:calc(50% + 8px);right:4%;width:80px;height:80px;box-shadow:0 6px 26px rgba(0,0,0,0.08)}
.slot-3 svg{width:38px;height:38px}

/* ── Bob keyframes ── */
.bob-0{animation:b0 4s ease-in-out infinite}
.bob-1{animation:b1 3.5s ease-in-out infinite .5s}
.bob-2{animation:b2 3.8s ease-in-out infinite .3s}
.bob-3{animation:b3 4.2s ease-in-out infinite .7s}
@keyframes b0{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes b1{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes b2{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes b3{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ── Responsive ── */
@media(max-width:640px){
  .scene{height:350px}
  .glass-card{width:150px;height:150px;border-radius:38px}
  .center-icon,.center-icon svg{width:68px;height:68px}
  .pill-top{top:calc(50% - 120px)}
  .pill-label{top:calc(50% + 108px);font-size:14px;padding:6px 20px}
  .haze{width:380px;height:380px}
  .slot-0{width:58px;height:58px;left:2%}.slot-0 svg{width:28px;height:28px}
  .slot-1{width:42px;height:42px;left:16%}.slot-1 svg{width:20px;height:20px}
  .slot-2{width:54px;height:54px;right:14%}.slot-2 svg{width:26px;height:26px}
  .slot-3{width:58px;height:58px;right:1%}.slot-3 svg{width:28px;height:28px}
}
</style>
</head>
<body>

<div class="scene">
  <div class="haze"></div>
  <div class="pill-top">AUTO</div>

  <div class="glass-card">
    <div class="pulse" id="pulse"></div>
    <div class="center-icon" id="centerIcon"></div>
  </div>

  <div class="pill-label" id="label">Dating</div>

  <button class="float-btn slot-0 bob-0" id="f0" onclick="switchMode(0)"></button>
  <button class="float-btn slot-1 bob-1" id="f1" onclick="switchMode(1)"></button>
  <button class="float-btn slot-2 bob-2" id="f2" onclick="switchMode(2)"></button>
  <button class="float-btn slot-3 bob-3" id="f3" onclick="switchMode(3)"></button>
</div>

<script>
/* ── Icon SVGs ── */
const ICONS = {
  working: `<svg viewBox="0 0 48 48" fill="currentColor"><circle cx="24" cy="9" r="5"/><path d="M16 18h16c1.7 0 3 1.3 3 3v6H13v-6c0-1.7 1.3-3 3-3z"/><rect x="12" y="27" width="24" height="3" rx="1.5"/><rect x="15" y="30" width="3" height="11" rx="1.5"/><rect x="30" y="30" width="3" height="11" rx="1.5"/></svg>`,

  outdoors: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="24" cy="24" r="16"/><line x1="8" y1="24" x2="40" y2="24"/><ellipse cx="24" cy="24" rx="9" ry="16"/></svg>`,

  social: `<svg viewBox="0 0 48 48" fill="currentColor"><circle cx="17" cy="18" r="6"/><circle cx="31" cy="18" r="6"/><path d="M5 40c0-6.6 5.4-12 12-12 3 0 5.8 1.1 8 3-1.5 2-2.4 4.4-2.4 7v2H5z"/><path d="M25.4 38c0-2.6.9-5 2.4-7 2.2-1.9 5-3 8-3 6.6 0 12 5.4 12 12H25.4z" opacity=".85"/><path d="M24 7c-1.2-2.4-4-3.2-5.8-1.6S17 10 24 14.5C31 10 31.2 7 29.8 5.6S25.2 4.6 24 7z" fill="#E879A8"/></svg>`,

  walking: `<svg viewBox="0 0 48 48" fill="currentColor"><circle cx="28" cy="7" r="4.5"/><path d="M23 16h9l-2 13h-5l-2-13z"/><path d="M26 29l-6 16h3.5l5-13z"/><path d="M30 29l3.5 16H30l-2.5-13z"/><rect x="9" y="13" width="16" height="3" rx="1.5" transform="rotate(-28 17 14.5)"/></svg>`,

  dining: `<svg viewBox="0 0 48 48" fill="currentColor"><rect x="9" y="5" width="2.5" height="13" rx="1.25"/><rect x="14" y="5" width="2.5" height="13" rx="1.25"/><rect x="19" y="5" width="2.5" height="13" rx="1.25"/><path d="M9 17h12.5v3.5c0 1.4-1.1 2.5-2.5 2.5h-7.5c-1.4 0-2.5-1.1-2.5-2.5V17z"/><rect x="14" y="23" width="2.5" height="19" rx="1.25"/><path d="M31 5h3c2 0 5 3 5 8.5V18h-8V5z"/><rect x="31" y="18" width="3" height="24" rx="1.5"/></svg>`,
};

/* ── Mode definitions ── */
const MODES = {
  working:  { label:'Working',  bg:'#8BC34A', iconKey:'working'  },
  outdoors: { label:'Outdoors', bg:'#7EBAB2', iconKey:'outdoors' },
  walking:  { label:'Walking',  bg:'#E8A540', iconKey:'walking'  },
  dining:   { label:'Dining',   bg:'#B8B3D8', iconKey:'dining'   },
  social:   { label:'Dating',   bg:'#7C6CD4', iconKey:'social'   },
};

const MODE_KEYS = ['working','outdoors','walking','dining','social'];

/* Center icon colors (per mode) */
const CENTER_COLORS = {
  working:  '#8BC34A',
  outdoors: '#7EBAB2',
  walking:  '#E8A540',
  dining:   '#B8B3D8',
  social:   '#7C6CD4',
};

/* ── State ── */
let activeMode = 'social';
let slots = ['working','outdoors','walking','dining']; // index = slot position

/* ── DOM refs ── */
const centerEl = document.getElementById('centerIcon');
const labelEl  = document.getElementById('label');
const pulseEl  = document.getElementById('pulse');
const floats   = [0,1,2,3].map(i => document.getElementById('f'+i));

/* ── Render ── */
function render(animate) {
  // Center icon
  if (animate) {
    const old = centerEl.querySelector('svg');
    if (old) { old.classList.remove('enter'); old.classList.add('exit'); setTimeout(()=>old.remove(), 400); }
    const wrap = document.createElement('div');
    wrap.innerHTML = ICONS[MODES[activeMode].iconKey];
    const svg = wrap.firstChild;
    svg.style.color = CENTER_COLORS[activeMode];
    svg.classList.add('enter');
    centerEl.appendChild(svg);

    // Pulse
    pulseEl.classList.remove('fire');
    void pulseEl.offsetWidth;
    pulseEl.classList.add('fire');
  } else {
    centerEl.innerHTML = ICONS[MODES[activeMode].iconKey];
    const svg = centerEl.querySelector('svg');
    svg.style.color = CENTER_COLORS[activeMode];
  }

  // Label
  labelEl.style.opacity = animate ? '0' : '1';
  labelEl.textContent = MODES[activeMode].label;
  if (animate) setTimeout(()=> labelEl.style.opacity = '1', 150);

  // Floating icons
  slots.forEach((modeKey, i) => {
    const btn = floats[i];
    const mode = MODES[modeKey];
    btn.style.backgroundColor = mode.bg;
    btn.innerHTML = ICONS[mode.iconKey];
    btn.querySelector('svg').style.fill = 'white';
    // For stroke-based icons (outdoors), set stroke too
    const svg = btn.querySelector('svg');
    if (svg.querySelector('[stroke]')) {
      svg.querySelectorAll('[stroke="currentColor"]').forEach(el => {
        el.setAttribute('stroke', 'white');
      });
      svg.querySelectorAll('[fill="currentColor"]').forEach(el => {
        el.setAttribute('fill', 'white');
      });
    }
  });
}

/* ── Switch mode ── */
function switchMode(slotIndex) {
  const newActive = slots[slotIndex];
  if (newActive === activeMode) return;
  const oldActive = activeMode;

  // Swap
  activeMode = newActive;
  slots[slotIndex] = oldActive;

  render(true);
}

/* ── Initial render ── */
render(false);
</script>
</body>
</html>
