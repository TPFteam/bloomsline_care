name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://www.bloomsline.com

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

      - name: Check for secrets in code
        run: |
          # Check for actual API keys/tokens in tracked files (not partial word matches)
          FOUND=0
          if git grep -l 'sk-ant-api' -- ':!.github' ':!node_modules' 2>/dev/null; then
            echo "⚠️ Anthropic API key found!" && FOUND=1
          fi
          if git grep -l 'GOCSPX-' -- ':!.github' ':!node_modules' 2>/dev/null; then
            echo "⚠️ Google OAuth secret found!" && FOUND=1
          fi
          if git grep -lP 'eyJhbGciOiJIUzI1NiIs[A-Za-z0-9+/=]{50,}' -- ':!.github' ':!node_modules' 2>/dev/null; then
            echo "⚠️ JWT token found!" && FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "✓ No secrets detected"
